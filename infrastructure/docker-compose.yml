version: '3.8'

services:
  influxdb:
    image: influxdb:2.7-alpine
    container_name: ac-telemetry-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=f1telemetryadmin123
      - DOCKER_INFLUXDB_INIT_ORG=motorsport
      - DOCKER_INFLUXDB_INIT_BUCKET=telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=supersecret-f1-telemetry-token
    volumes:
      - influxdb_data:/var/lib/influxdb2

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: ac-telemetry-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "9996:9996/udp"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=supersecret-f1-telemetry-token
      - INFLUX_ORG=motorsport
      - INFLUX_BUCKET=telemetry
      - AC_HOST=host.docker.internal
      - AC_PORT=9996
    depends_on:
      - influxdb

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: ac-telemetry-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  influxdb_data:
